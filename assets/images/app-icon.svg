<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- Safe zone background for App Store / Play Store -->
  <rect width="1024" height="1024" fill="#F8FAFC" />

  <!-- Scaled-down and optically centered symbol (~60% of canvas) -->
  <g transform="translate(512, 512) scale(0.68) translate(-512, -490)">
    <!-- Outer Location Pin -->
    <path 
      d="M512 180 C340 180 200 320 200 492 C200 660 470 820 500 838 C507 842 517 842 524 838 C554 820 824 660 824 492 C824 320 684 180 512 180 Z" 
      fill="none" 
      stroke="#1E293B" 
      stroke-width="56" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Magnifying Glass Lens Outer Circle -->
    <circle 
      cx="512" 
      cy="470" 
      r="150" 
      fill="#F8FAFC" 
      stroke="#1E293B" 
      stroke-width="56" 
    />

    <!-- Magnifying Glass Handle -->
    <line 
      x1="620" 
      y1="578" 
      x2="770" 
      y2="728" 
      stroke="#1E293B" 
      stroke-width="60" 
      stroke-linecap="round" 
    />

    <!-- Center Verification Checkmark -->
    <path 
      d="M448 472 L492 516 L580 424" 
      fill="none" 
      stroke="#1E293B" 
      stroke-width="52" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
