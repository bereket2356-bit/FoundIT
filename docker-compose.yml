version: "3.8"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: foundit-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
    networks:
      - foundit-network

  admin-frontend:
    build:
      context: ./Admin/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    container_name: foundit-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - foundit-network

networks:
  foundit-network:
    driver: bridge
